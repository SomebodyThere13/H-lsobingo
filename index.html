<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hälsobingo Detaljplanering 2026</title>

<style>

:root{
    --bg:#ececec;
    --panel:#f7f7f7;
    --gold:#d9b178;
    --green:#007c2e;
    --green-dark:#005e22;
    --success:#0b8d33;
    --danger:#c01749;
    --text:#222;
    --shadow:0 8px 20px rgba(0,0,0,0.12);
}

*{box-sizing:border-box;}

body{
    font-family: Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    margin:0;
    padding:20px;
}

.container{
    max-width:1400px;
    margin:auto;
}

h1{
    text-align:center;
    font-size:54px;
    font-weight:400;
    margin-bottom:20px;
}

.profile-bar{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:15px;
    background:var(--panel);
    border:2px solid var(--gold);
    border-radius:12px;
    padding:12px 16px;
    box-shadow:var(--shadow);
}

.profile-bar label{
    font-size:18px;
    font-weight:600;
}

.profile-select,
.profile-input,
button,
.modal button{
    font:inherit;
}

.profile-select,
.profile-input{
    border:2px solid var(--gold);
    border-radius:8px;
    padding:10px 12px;
    font-size:16px;
    min-width:180px;
    background:#fff;
}

button,
.modal button{
    background:var(--green);
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
    transition:background .2s ease;
    font-size:16px;
}

button:hover,
.modal button:hover{
    background:var(--green-dark);
}

button.secondary{
    background:#6c757d;
}

button.secondary:hover{
    background:#565e66;
}

button.danger{
    background:#b52d4b;
}

button.danger:hover{
    background:#8d1d38;
}

.stats{
    text-align:center;
    font-size:20px;
    margin-bottom:15px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:0;
    border:2px solid var(--gold);
    background:#fff;
}

.cell{
    aspect-ratio:1/1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:12px;
    font-size:18px;
    line-height:1.2;
    cursor:pointer;
    border:2px solid var(--gold);
    transition:.2s;
    user-select:none;
    background:#fff;
}

.cell:focus{
    outline:3px solid rgba(0,124,46,0.9);
    outline-offset:2px;
}

.beige{background:#ead2b2;}
.gray{background:#f4f4f4;}

.completed {
    border:6px solid var(--success) !important;
    background:#ffffff !important;
    font-weight:bold;
}

.bingo{
    border:6px solid var(--danger) !important;
}

.footer{
    margin-top:20px;
    font-size:22px;
}

#message{
    text-align:center;
    color:var(--success);
    font-size:32px;
    font-weight:bold;
    margin-top:20px;
    min-height:48px;
}

.modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.45);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-backdrop.visible{
    display:flex;
}

.modal {
    width:min(720px, 98%);
    background:#fff;
    border:2px solid var(--gold);
    border-radius:12px;
    box-shadow:var(--shadow);
    padding:20px;
}

.modal h2{
    margin-top:0;
    margin-bottom:16px;
    text-align:center;
}

.modal form{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:8px;
}

.leaderboard-list{
    display:flex;
    flex-direction:column;
    gap:8px;
    max-height:60vh;
    overflow:auto;
}

.leaderboard-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 12px;
    border-radius:8px;
    background:#f8f8f8;
    border:1px solid #e6e6e6;
}

.leaderboard-rank{
    font-weight:800;
    margin-right:12px;
}

@media(max-width:1200px){
    .cell{font-size:14px;}
    h1{font-size:32px;}
}

@media(max-width:600px){
    .profile-bar{
        flex-direction:column;
    }

    .profile-select,
    .profile-input{
        width:100%;
    }
}

</style>
</head>
<body>

<div class="container">

<h1>HÄLSOBINGO DETALJPLANERING 2026</h1>

<div class="profile-bar" aria-label="Hantera profiler">
    <label for="profileSelect">Profil:</label>
    <select id="profileSelect" class="profile-select" aria-label="Välj profil"></select>
    <button id="addProfileBtn" type="button">Ny profil</button>
    <button id="deleteProfileBtn" type="button" class="danger">Radera profil</button>
    <button id="leaderboardBtn" type="button" class="secondary">Topplista</button>
</div>

<div class="stats">
✅ Klara aktiviteter:
<span id="count">0</span> / 36
&nbsp;&nbsp;|&nbsp;&nbsp;
🏆 Bingor:
<span id="bingocount">0</span>
</div>

<div id="board" class="grid" aria-label="Hälsobingo-bricka"></div>

<div id="message" role="status" aria-live="polite"></div>

<div class="footer">

<p><strong>15 okt - 15 nov</strong> - Kryssa rutor. Har du kryssat alla rutor på en hel rad eller kolumn har du fått BINGO.</p>

<button id="resetButton" type="button">
Återställ bingobricka
</button>

</div>

</div>

<div id="profileModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="profileModalTitle">
        <h2 id="profileModalTitle">Skapa ny profil</h2>
        <form id="profileForm">
            <input id="profileNameInput" class="profile-input" type="text" maxlength="40" placeholder="Skriv namn eller alias" aria-label="Profilnamn" required>
            <div class="modal-actions">
                <button type="button" class="secondary" id="cancelProfileBtn">Avbryt</button>
                <button type="submit">Spara profil</button>
            </div>
        </form>
    </div>
</div>

<div id="leaderboardModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="leaderboardTitle">
        <h2 id="leaderboardTitle">Topplista</h2>
        <div id="leaderboardList" class="leaderboard-list" aria-live="polite"></div>
        <div class="modal-actions" style="margin-top:12px;">
            <button type="button" class="secondary" id="closeLeaderboardBtn">Stäng</button>
        </div>
    </div>
</div>

<script>

const activities = [

["Dricka en kopp kaffe/the i skogen","beige"],
["Gå en långpromenad minst 60 min","gray"],
["Läsa en bok","beige"],
["Träna ett pass i källargymmet","gray"],
["Fika med en vän","beige"],
["Gå och lägga sig senast 21.30","gray"],

["Skriva ner en sak du är tacksam för varje dag under en vecka","gray"],
["Ta sovmorgon","beige"],
["Dansa till en bra låt","gray"],
["Testa en (för dig) ny träningsform","beige"],
["Basta","gray"],
["Laga ett nytt vegetariskt recept","beige"],

["Bestiga Bräntis eller annat berg","beige"],
["Skriv ner dina tre bästa egenskaper","gray"],
["Ta ett dopp i kallt vatten/kall dusch","beige"],
["10 axelrullningar","gray"],
["Se en film","beige"],
["Promenera Bölesholmarna runt en lunch","gray"],

["Sitta ute 15 min utan telefon/musik/bok","gray"],
["Ge någon massage","beige"],
["Göra något pulshöjande med en kollega","gray"],
["Göra 50 knäböj","beige"],
["15 min stretching under arbetsdagen","gray"],
["Ta fem djupa andetag när du känner dig stressad","beige"],

["Skänka en slant till välgörenhet","beige"],
["Äta minst två färgrika grönsaker till en måltid","gray"],
["Hjälpa en främling","beige"],
["Ge positiv feedback till en familjemedlem eller vän","gray"],
["Gå minst 10 000 steg 3 dagar under en vecka","beige"],
["Ta en promenad en väg du inte gått tidigare","gray"],

["Min valfria hälsoaktivitet","gray"],
["Nyttja friskvårdsbidraget","beige"],
["Gå upp för trapporna till kontoret under en hel vecka","gray"],
["Ta en power nap","beige"],
["Äta frukost i lugn och ro utan skärmar","gray"],
["Stå upp och jobba minst en timme per dag i en vecka","beige"]

];

const STORAGE_KEY = "detaljplanering_bingo";
const PROFILES_KEY = "detaljplanering_profiles";
const ACTIVE_PROFILE_KEY = "detaljplanering_active_profile";

let profiles = [];
let activeProfileId = null;
let checked = [];

const board = document.getElementById("board");
const countEl = document.getElementById("count");
const bingoEl = document.getElementById("bingocount");
const messageEl = document.getElementById("message");
const resetButton = document.getElementById("resetButton");
const profileSelect = document.getElementById("profileSelect");
const addProfileBtn = document.getElementById("addProfileBtn");
const deleteProfileBtn = document.getElementById("deleteProfileBtn");
const profileModal = document.getElementById("profileModal");
const profileForm = document.getElementById("profileForm");
const profileNameInput = document.getElementById("profileNameInput");
const cancelProfileBtn = document.getElementById("cancelProfileBtn");
const leaderboardBtn = document.getElementById("leaderboardBtn");
const leaderboardModal = document.getElementById("leaderboardModal");
const leaderboardList = document.getElementById("leaderboardList");
const closeLeaderboardBtn = document.getElementById("closeLeaderboardBtn");

function createProfileId(){
    return `profile_${Date.now()}_${Math.random().toString(36).slice(2, 9)}`;
}

function migrateLegacyBoard(){
    try {
        const legacy = localStorage.getItem(STORAGE_KEY);
        if (!legacy) return [];
        const parsed = JSON.parse(legacy);
        return Array.isArray(parsed) ? parsed : [];
    } catch (error) {
        return [];
    }
}

function loadProfiles(){
    try {
        const rawProfiles = localStorage.getItem(PROFILES_KEY);
        profiles = rawProfiles ? JSON.parse(rawProfiles) : [];
    } catch (error) {
        profiles = [];
    }

    if (!Array.isArray(profiles) || profiles.length === 0) {
        const legacy = migrateLegacyBoard();
        const defaultProfile = {
            id: createProfileId(),
            name: "Min profil",
            checked: legacy
        };
        profiles = [defaultProfile];
        saveProfiles();
    }

    try {
        const activeRaw = localStorage.getItem(ACTIVE_PROFILE_KEY);
        if (activeRaw && profiles.some(profile => profile.id === activeRaw)) {
            activeProfileId = activeRaw;
        }
    } catch (error) {
        activeProfileId = null;
    }

    if (!activeProfileId || !profiles.some(profile => profile.id === activeProfileId)) {
        activeProfileId = profiles[0].id;
    }

    try { localStorage.setItem(ACTIVE_PROFILE_KEY, activeProfileId); } catch(e){}
    const activeProfile = getActiveProfile();
    checked = Array.isArray(activeProfile.checked) ? activeProfile.checked : [];
}

function saveProfiles(){
    try {
        localStorage.setItem(PROFILES_KEY, JSON.stringify(profiles));
    } catch (error) {
        // Ignore storage errors
    }
    renderLeaderboard();
}

function getActiveProfile(){
    return profiles.find(profile => profile.id === activeProfileId) || profiles[0];
}

function persistCurrentProfile(){
    const activeProfile = getActiveProfile();
    if (!activeProfile) return;
    activeProfile.checked = Array.isArray(checked) ? checked : [];
    saveProfiles();
    try {
        localStorage.setItem(ACTIVE_PROFILE_KEY, activeProfile.id);
    } catch (error) {
        // Ignore storage errors
    }
}

function renderProfileSelector(){
    profileSelect.innerHTML = "";

    profiles.forEach(profile => {
        const option = document.createElement("option");
        option.value = profile.id;
        option.textContent = profile.name;
        if (profile.id === activeProfileId) {
            option.selected = true;
        }
        profileSelect.appendChild(option);
    });

    deleteProfileBtn.disabled = profiles.length <= 1;
}

function updateStats(){
    countEl.textContent = checked.length;
    checkBingo();
    persistCurrentProfile();
}

function computeBingoCountFromChecked(checkedArr){
    // returns number of completed rows+columns for a given checked array
    const cellsCompleted = new Set(Array.isArray(checkedArr) ? checkedArr : []);
    let bingoCount = 0;

    // rows
    for (let row = 0; row < 6; row++){
        let complete = true;
        for (let col = 0; col < 6; col++){
            const index = row*6 + col;
            if (!cellsCompleted.has(index)) { complete = false; break; }
        }
        if (complete) bingoCount++;
    }

    // columns
    for (let col = 0; col < 6; col++){
        let complete = true;
        for (let row = 0; row < 6; row++){
            const index = row*6 + col;
            if (!cellsCompleted.has(index)) { complete = false; break; }
        }
        if (complete) bingoCount++;
    }

    return bingoCount;
}

function renderLeaderboard(){
    // Build list of profiles with bingo counts and completed counts
    const list = profiles.map(p => {
        const completedCount = Array.isArray(p.checked) ? p.checked.length : 0;
        const bingoCount = computeBingoCountFromChecked(p.checked);
        return {
            id: p.id,
            name: p.name,
            completedCount,
            bingoCount
        };
    });

    // sort: bingo desc, completed desc, name asc
    list.sort((a,b) => {
        if (b.bingoCount !== a.bingoCount) return b.bingoCount - a.bingoCount;
        if (b.completedCount !== a.completedCount) return b.completedCount - a.completedCount;
        return a.name.localeCompare(b.name);
    });

    leaderboardList.innerHTML = "";

    if (list.length === 0) {
        leaderboardList.textContent = "Inga profiler hittades.";
        return;
    }

    list.forEach((item, idx) => {
        const el = document.createElement('div');
        el.className = 'leaderboard-item';

        el.innerHTML = `
            <div style="display:flex; align-items:center; gap:12px;">
                <div class="leaderboard-rank">${idx+1}</div>
                <div>
                    <div style="font-weight:700;">${escapeHtml(item.name)}</div>
                    <div style="font-size:13px;color:#555;">${item.completedCount} kryss • ${item.bingoCount} bingor</div>
                </div>
            </div>
            <div style="font-weight:800;">${item.bingoCount > 0 ? '🏆' : ''}</div>
        `;

        // clicking a leaderboard item will switch to that profile
        el.addEventListener('click', () => {
            activeProfileId = item.id;
            const activeProfile = getActiveProfile();
            checked = Array.isArray(activeProfile.checked) ? activeProfile.checked : [];
            try { localStorage.setItem(ACTIVE_PROFILE_KEY, activeProfileId); } catch(e){}
            renderProfileSelector();
            renderBoard();
            closeLeaderboard();
        });

        leaderboardList.appendChild(el);
    });
}

function escapeHtml(str){
    return String(str).replace(/[&<>"]+/g, (s) => {
        return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[s];
    });
}

function updateStats(){
    // (duplicate definition removed later)
}

function checkBingo(){
    const cells = [...document.querySelectorAll(".cell")];

    cells.forEach(cell => cell.classList.remove("bingo"));

    let bingoCount = 0;

    for (let row = 0; row < 6; row++) {
        let complete = true;

        for (let col = 0; col < 6; col++) {
            const index = row * 6 + col;
            if (!cells[index].classList.contains("completed")) {
                complete = false;
            }
        }

        if (complete) {
            bingoCount++;
            for (let col = 0; col < 6; col++) {
                cells[row * 6 + col].classList.add("bingo");
            }
        }
    }

    for (let col = 0; col < 6; col++) {
        let complete = true;

        for (let row = 0; row < 6; row++) {
            const index = row * 6 + col;
            if (!cells[index].classList.contains("completed")) {
                complete = false;
            }
        }

        if (complete) {
            bingoCount++;
            for (let row = 0; row < 6; row++) {
                cells[row * 6 + col].classList.add("bingo");
            }
        }
    }

    bingoEl.textContent = bingoCount;
    messageEl.textContent = bingoCount > 0 ? "🎉 BINGO! 🎉" : "";
}

function renderBoard(){
    board.innerHTML = "";

    activities.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = `cell ${item[1]}`;
        div.textContent = item[0];
        div.setAttribute("tabindex", "0");
        div.setAttribute("role", "button");
        div.setAttribute("aria-pressed", checked.includes(index) ? "true" : "false");

        if (checked.includes(index)) {
            div.classList.add("completed");
        }

        const toggleCell = () => {
            div.classList.toggle("completed");

            if (div.classList.contains("completed")) {
                if (!checked.includes(index)) {
                    checked.push(index);
                }
            } else {
                checked = checked.filter(value => value !== index);
            }

            div.setAttribute("aria-pressed", div.classList.contains("completed") ? "true" : "false");
            updateStats();
        };

        div.addEventListener("click", toggleCell);
        div.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                toggleCell();
            }
        });

        board.appendChild(div);
    });

    checkBingo();
    countEl.textContent = checked.length;
}

function resetBoard(){
    if (confirm("Vill du återställa den aktuella profilens bingobricka?")) {
        checked = [];
        renderBoard();
        persistCurrentProfile();
    }
}

function openProfileModal(){
    profileModal.classList.add("visible");
    profileModal.setAttribute("aria-hidden", "false");
    profileNameInput.value = "";
    profileNameInput.focus();
}

function closeProfileModal(){
    profileModal.classList.remove("visible");
    profileModal.setAttribute("aria-hidden", "true");
    profileForm.reset();
}

function addProfile(name){
    const cleanedName = name.trim();
    if (!cleanedName) {
        profileNameInput.focus();
        return;
    }

    const profile = {
        id: createProfileId(),
        name: cleanedName,
        checked: []
    };

    profiles.push(profile);
    activeProfileId = profile.id;
    checked = [];
    saveProfiles();
    renderProfileSelector();
    renderBoard();
    closeProfileModal();
}

function deleteCurrentProfile(){
    if (profiles.length <= 1) {
        alert("Du måste ha minst en profil kvar.");
        return;
    }

    const profileToDelete = getActiveProfile();
    const confirmed = confirm(`Vill du radera profilen "${profileToDelete.name}"?`);
    if (!confirmed) return;

    profiles = profiles.filter(profile => profile.id !== profileToDelete.id);
    activeProfileId = profiles[0].id;
    checked = getActiveProfile().checked || [];
    saveProfiles();
    renderProfileSelector();
    renderBoard();
}

function openLeaderboard(){
    renderLeaderboard();
    leaderboardModal.classList.add('visible');
    leaderboardModal.setAttribute('aria-hidden','false');
}

function closeLeaderboard(){
    leaderboardModal.classList.remove('visible');
    leaderboardModal.setAttribute('aria-hidden','true');
}

profileSelect.addEventListener("change", (event) => {
    activeProfileId = event.target.value;
    const activeProfile = getActiveProfile();
    checked = Array.isArray(activeProfile.checked) ? activeProfile.checked : [];
    try { localStorage.setItem(ACTIVE_PROFILE_KEY, activeProfileId); } catch(e){}
    renderBoard();
    renderProfileSelector();
});

addProfileBtn.addEventListener("click", openProfileModal);
cancelProfileBtn.addEventListener("click", closeProfileModal);
resetButton.addEventListener("click", resetBoard);
deleteProfileBtn.addEventListener("click", deleteCurrentProfile);

profileForm.addEventListener("submit", (event) => {
    event.preventDefault();
    addProfile(profileNameInput.value);
});

profileModal.addEventListener("click", (event) => {
    if (event.target === profileModal) {
        closeProfileModal();
    }
});

leaderboardBtn.addEventListener('click', openLeaderboard);
closeLeaderboardBtn.addEventListener('click', closeLeaderboard);
leaderboardModal.addEventListener('click', (event) => { if (event.target === leaderboardModal) closeLeaderboard(); });

loadProfiles();
renderProfileSelector();
renderBoard();
renderLeaderboard();

</script>

</body>
</html>
